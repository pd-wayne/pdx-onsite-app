name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pulls in requirements.txt too. Windows-only
          # packages there (python-escpos, pywin32) are skipped automatically
          # via their sys_platform marker — this app's printing code is
          # Windows-only, but the test suite mocks printer.py's win32 calls
          # so everything else is fully testable on Linux CI.
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q
